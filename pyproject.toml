[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "Adaptive stream learning for Card-Not-Present credit-card fraud detection under concept drift"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15,<23",
    "scikit-learn>=1.4,<2",
    "river>=0.21,<1",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
    "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
sentinelflow = "sentinelflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]